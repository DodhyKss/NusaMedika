<!DOCTYPE html>
<html>
<head>
  <script src="public/vendor/jquery/jquery.min.js"></script>
  <script src="public/vendor/select2/js/select2.min.js"></script>
</head>
<body>
  <select class="my-select" style="width: 200px;"></select>
  <script>
    $(document).ready(function() {
      try {
        $('.my-select').select2({ allowClear: true, placeholder: "Select" });
        console.log("Success");
      } catch (e) {
        console.log("Error:", e);
      }
    });
  </script>
</body>
</html>
