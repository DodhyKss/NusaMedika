# =============================================================================
#  VirtualHost Apache untuk container `web` (NusaMedika)
#  Request .php diteruskan ke service PHP-FPM `app` via mod_proxy_fcgi.
# =============================================================================

<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Folder Laravel di luar document root (penyimpanan upload, log, cache)
    <Directory /var/www/html/storage>
        Options -Indexes
        Require all granted
    </Directory>

    # Semua file .php ditangani PHP-FPM (bukan mod_php)
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

    # Host header asli diteruskan ke PHP-FPM (penting untuk URL & session)
    ProxyPreserveHost On
    ProxyTimeout 300

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always unset X-Powered-By
    </IfModule>

    # Log container (docker logs)
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
