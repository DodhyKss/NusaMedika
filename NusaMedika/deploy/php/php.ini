; Tuning PHP untuk SIMRS NusaMedika (container FPM & CLI)
; Diinstall ke /usr/local/etc/php/conf.d/99-nusamedika.ini

memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; displaying errors handled by Laravel
display_errors = Off
