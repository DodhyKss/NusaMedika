services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meditech-app:dev
    container_name: meditech_app
    # Mengekspos port 8000 agar bisa diakses di browser komputer host (localhost:8000)
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Memastikan koneksi database
      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      # Menggunakan sync/file/database agar tidak bergantung pada redis
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    # Mem-binding folder saat ini ke dalam container secara live (Hot Reloading)
    volumes:
      - ./:/var/www/html
    # Otomatis install dependency (jika belum ada) lalu jalankan built-in server PHP
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - meditech_network

  vite:
    image: node:22-alpine
    container_name: meditech_vite
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    # Otomatis install dependency npm lalu jalankan vite server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - meditech_network

networks:
  meditech_network:
    driver: bridge
