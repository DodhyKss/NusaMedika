services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nusamedika-app:dev
    container_name: nusamedika_app
    network_mode: "host"
    # Menjalankan proses sebagai user host (uid 1000) agar file yang dibuat
    # dari dalam container (mis. via artisan) ber-owner user host, bukan root,
    # sehingga mudah diedit/dihapus dari komputer lokal.
    user: "1000:1000"
    env_file:
      - .env
    environment:
      # Memastikan koneksi database
      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      # Menggunakan sync/file/database agar tidak bergantung pada redis
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    # Mem-binding folder saat ini ke dalam container secara live (Hot Reloading)
    volumes:
      - ./:/var/www/html
    # Otomatis install dependency (jika belum ada) lalu jalankan built-in server PHP
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    container_name: nusamedika_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: "${DB_DATABASE:-meditech}"
      MYSQL_USER: "${DB_USERNAME:-meditech}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-meditech}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  vite:
    image: node:22-alpine
    container_name: nusamedika_vite
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    # Otomatis install dependency npm lalu jalankan vite server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    network_mode: "host"

volumes:
  mysql_data:
