# =============================================================================
#  Tuning Redis — instalasi MANUAL (di luar Docker)
#
#  Blok ini di-APPEND ke /etc/redis/redis.conf (jangan menimpa file aslinya):
#    sudo cat deploy/redis/redis-manual.conf >> /etc/redis/redis.conf
#    sudo systemctl restart redis-server
#
#  Catatan: pada mode manual Redis berjalan di host, jadi hanya boleh di-bind
#  ke loopback (127.0.0.1) — jangan 0.0.0.0.
# =============================================================================

bind 127.0.0.1 -::1
protected-mode yes
port 6379

maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistensi ringan (cukup untuk cache & session)
save 900 1
save 300 10
appendonly no
