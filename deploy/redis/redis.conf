# Konfigurasi Redis untuk container `redis` (OPSIONAL)
# Service ini hanya aktif dengan:  docker compose --profile redis up -d
# Aplikasi tetap jalan tanpa Redis (driver file/sync di .env).

maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistensi: cukup untuk cache/session, queue tidak butuh durability tinggi
save 900 1
save 300 10
appendonly no

# Binding default (hanya jaringan internal compose)
bind 0.0.0.0
protected-mode no
port 6379
