# =============================================================================
#  VirtualHost Apache — instalasi MANUAL (di luar Docker)
#
#  Placeholder yang harus diganti saat menyalin file ini:
#    __APP_DIR__  : direktori proyek, contoh /home/user/nusamedika
#    __PHP_VER__  : versi PHP-FPM, contoh 8.5
#    __PORT__     : port HTTP, contoh 8081
#
#  Cara pakai:
#    sudo cp deploy/apache/nusamedika-manual.conf /etc/apache2/sites-available/nusamedika.conf
#    sudo sed -i "s#__APP_DIR__#$PWD#g; s#__PHP_VER__#8.5#g; s#__PORT__#8081#g" \
#         /etc/apache2/sites-available/nusamedika.conf
# =============================================================================

<VirtualHost *:__PORT__>
    ServerName localhost
    ServerAlias 127.0.0.1

    DocumentRoot __APP_DIR__/public

    <Directory __APP_DIR__/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Folder Laravel di luar document root (penyimpanan upload, log, cache)
    <Directory __APP_DIR__/storage>
        Options -Indexes
        Require all granted
    </Directory>

    # Semua file .php ditangani PHP-FPM (bukan mod_php)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php__PHP_VER__-fpm.sock|fcgi://localhost:9000"
    </FilesMatch>

    # Host header asli diteruskan ke PHP-FPM (penting untuk URL & session)
    ProxyPreserveHost On
    ProxyTimeout 300

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always unset X-Powered-By
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/nusamedika-error.log
    CustomLog ${APACHE_LOG_DIR}/nusamedika-access.log combined
</VirtualHost>
