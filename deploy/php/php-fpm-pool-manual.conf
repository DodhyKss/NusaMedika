; =============================================================================
;  Pool PHP-FPM — instalasi MANUAL (di luar Docker)
;
;  Pengganti /etc/php/<versi>/fpm/pool.d/www.conf
;
;  Cara pakai:
;    sudo cp /etc/php/8.5/fpm/pool.d/www.conf /etc/php/8.5/fpm/pool.d/www.conf.bak
;    sudo cp deploy/php/php-fpm-pool-manual.conf /etc/php/8.5/fpm/pool.d/www.conf
;    sudo systemctl restart php8.5-fpm
; =============================================================================

[www]

; User & group proses PHP-FPM
user = www-data
group = www-data

; Socket UNIX (dipakai vhost Apache lewat proxy_fcgi)
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 511

; Penjadwalan worker
pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500

; Batas eksekusi script (upload besar / laporan EMR butuh waktu)
request_terminate_timeout = 300s
request_slowlog_timeout = 30s
slowlog = /var/log/php8.5-fpm-slow.log

; Output worker masuk ke log FPM
catch_workers_output = yes
decorate_workers_output = no

; Jangan bersihkan environment (bantu debugging; konstanta SIMRS tetap dibaca dari .env)
clear_env = no

; Batas memori per worker
php_admin_value[memory_limit] = 512M
php_admin_value[error_log] = /var/log/php8.5-fpm.log
php_admin_flag[log_errors] = on
